<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realinsight Model Form Inspector</title>
  <style>
    :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); background: var(--color-background-primary, Canvas); color: var(--color-text-primary, CanvasText); font-size: 14px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1000px; margin: auto; }
    .brand { width: 170px; height: 28px; display: block; }
    h1 { font-size: 24px; letter-spacing: -.02em; margin: 20px 0 6px; overflow-wrap: anywhere; }
    h2 { font-size: 16px; margin: 0; }
    h3 { font-size: 14px; margin: 22px 0 10px; }
    p { line-height: 1.5; }
    .muted, dt { color: var(--color-text-secondary, GrayText); }
    .intro { margin: 0; }
    .toolbar, .heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .toolbar { margin: 20px 0 10px; }
    .badge { font-size: 12px; background: var(--color-background-secondary, light-dark(#edf2f6, #242b35)); border-radius: 5px; padding: 5px 8px; }
    button { font: inherit; color: inherit; background: var(--color-background-primary, Canvas); border: 1px solid var(--color-border-primary, light-dark(#d1d5db, #42474e)); border-radius: 8px; min-height: 40px; padding: 8px 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, summary:focus-visible, input:focus-visible, .table-wrap:focus-visible { outline: 3px solid #3498db; outline-offset: 3px; }
    label { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; }
    input { accent-color: #075dc5; width: 16px; height: 16px; }
    #status { font-size: 12px; min-height: 18px; margin: 6px 0 18px; }
    .overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; border-top: 1px solid var(--color-border-primary, light-dark(#d1d5db, #42474e)); padding-top: 18px; margin: 20px 0; }
    .overview dt { font-size: 12px; margin-bottom: 6px; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .workspace { display: grid; grid-template-columns: minmax(240px, 2fr) minmax(0, 3fr); border: 1px solid var(--color-border-primary, light-dark(#d1d5db, #42474e)); border-radius: 12px; overflow: hidden; }
    .pane { min-width: 0; padding: 20px; }
    .structure { border-right: 1px solid var(--color-border-primary, light-dark(#d1d5db, #42474e)); }
    .scroll { max-height: 480px; overflow: auto; padding: 4px; }
    #tree { margin-top: 16px; }
    #tree ul { list-style: none; margin: 0; padding-left: 14px; }
    #tree > ul { padding-left: 0; }
    #tree summary, .leaf { padding: 10px 8px; border-radius: 6px; cursor: pointer; overflow-wrap: anywhere; }
    #tree summary:hover, .leaf:hover { background: var(--color-background-secondary, light-dark(#edf2f6, #242b35)); }
    #tree [aria-current="true"] { background: var(--color-background-secondary, light-dark(#edf2f6, #242b35)); box-shadow: inset 3px 0 #3498db; }
    #tree small { display: block; color: var(--color-text-secondary, GrayText); font-size: 12px; margin-top: 4px; }
    .leaf { width: 100%; text-align: left; border: 0; background: transparent; }
    .node-meta { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px 14px; margin: 18px 0; font-size: 12px; }
    .table-wrap { overflow: auto; max-height: 320px; }
    table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: 12px; }
    th:nth-child(n+2), td:nth-child(n+2) { white-space: nowrap; }
    th { text-align: left; font-weight: 550; color: var(--color-text-secondary, GrayText); }
    td, th { padding: 10px 8px; vertical-align: top; border-bottom: 1px solid var(--color-border-primary, light-dark(#d1d5db, #42474e)); overflow-wrap: anywhere; }
    .empty { padding: 22px 0; font-size: 13px; }
    #warnings { padding-left: 20px; font-size: 12px; }
    footer { margin-top: 14px; font-size: 12px; line-height: 1.5; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) { body { padding: 16px; } .workspace { grid-template-columns: 1fr; } .structure { border-right: 0; border-bottom: 1px solid var(--color-border-primary, light-dark(#d1d5db, #42474e)); } .structure .scroll { max-height: 260px; } .overview { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<main>

  <div class="heading"><h1 id="name">Model form inspector</h1><span class="badge">Read only</span></div>
  <p id="description" class="intro muted">Inspect a model form's structure and mappings alongside your conversation.</p>
  <div class="toolbar">
    <button id="refresh" disabled>Refresh</button>
    <label title="Check for changes every 30 seconds while this view is visible."><input id="auto" type="checkbox" checked disabled>Keep updated</label>
  </div>
  <p id="status" class="muted" role="status" aria-live="polite">Waiting for the model form…</p>
  <section id="content" hidden aria-label="Model form configuration">
    <dl id="overview" class="overview"></dl>
    <ul id="warnings" hidden></ul>
    <div class="workspace">
      <section class="pane structure" aria-label="Map hierarchy">
        <div class="heading"><h2>Map structure</h2><span id="counts" class="muted badge"></span></div>
        <nav id="tree" class="scroll" aria-label="Model form map nodes"></nav>
      </section>
      <section class="pane" aria-label="Selected map node">
        <h2 id="node-name">Select a map node</h2>
        <p id="node-description" class="muted"></p>
        <dl id="node-meta" class="node-meta"></dl>
        <div id="mappings"></div>
      </section>
    </div>
  </section>
  <footer class="muted">Configuration overview only. Continue making changes through the conversation or Realinsight. <span id="checked"></span></footer>
</main>
<script>
  const el = Object.fromEntries(Array.from(document.querySelectorAll('[id]')).map(element => [element.id, element]));
  const pending = new Map();
  const expanded = new Set();
  let nextId = 0, epoch = 0;
  let capabilities = {}, connected = false, busy = false, visible = true, reload = false;
  let target = null, customer = '', customerName = '', inspection = null, nodes = [], selected = '', detail = null, treeToken = '';
  const notify = (method, params) => window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  const canCall = () => connected && Boolean(capabilities.serverTools);
  const status = text => { el.status.textContent = text; };
  const sizeObserver = new ResizeObserver(() => {
    if (connected) notify('ui/notifications/size-changed', { height: Math.ceil(document.querySelector('main').getBoundingClientRect().height + 48) });
  });
  sizeObserver.observe(document.querySelector('main'));
  const visibilityObserver = new IntersectionObserver(entries => {
    const wasVisible = visible;
    visible = entries[0].isIntersecting;
    if (visible && !wasVisible) check();
  });
  visibilityObserver.observe(document.querySelector('main'));
  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++nextId;
      const timeout = setTimeout(() => { pending.delete(id); reject(new Error('The host did not respond. Try Refresh.')); }, 30000);
      pending.set(id, { resolve, reject, timeout });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }
  function controls() {
    el.refresh.disabled = !canCall() || !target || busy;
    el.auto.disabled = !canCall() || !target;
    el.content.setAttribute('aria-busy', String(busy));
    for (const button of el.tree.querySelectorAll('button')) button.disabled = busy;
  }
  function unpack(result) {
    if (result?.isError) throw new Error(result.content?.find(item => item.type === 'text')?.text || 'Unable to read this model form.');
    const payload = result?.structuredContent;
    if (payload?.is_truncated) throw new Error('This result is incomplete. Refresh to load the focused model form view.');
    const value = payload?.items?.[0];
    if (!value?.model_form?.model_form_id) throw new Error('The host did not return a model form configuration.');
    if (target && value.model_form_id !== target.model_form_id) throw new Error('The model form changed. Reopen its inspector.');
    const code = payload.provenance?.customer_code;
    if (customer && code && code !== customer) throw new Error('The customer connection changed. Reopen the model form in the new connection.');
    customer ||= code || '';
    customerName = payload.provenance?.customer_name || customerName;
    return { value, warnings: payload.warnings || [] };
  }
  async function read(sections, node_id) {
    if (!canCall()) throw new Error('This host does not support refreshing app views. Ask the agent to read the model form again.');
    return unpack(await request('tools/call', { name: 'get_model_form', arguments: { ...target, ...(sections ? { sections } : {}), ...(node_id ? { node_id } : {}) } }));
  }
  function clear() {
    inspection = null; nodes = []; selected = ''; detail = null; treeToken = '';
    el.content.hidden = true; el.name.textContent = 'Model form inspector';
    el.description.textContent = 'Inspect a model form\'s structure and mappings alongside your conversation.';
    el.checked.textContent = '';
    status('Waiting for the model form…');
  }
  function accept({ value, warnings }) {
    const changed = inspection && inspection.model_form.conflict_token !== value.model_form.conflict_token;
    if (changed) { nodes = []; detail = null; treeToken = ''; }
    inspection = value;
    if (value.map_tree) {
      nodes = value.map_tree.nodes || [];
      treeToken = value.model_form.conflict_token;
      if (!nodes.some(node => node.node_id === selected)) selected = value.map_tree.root_node_id || nodes[0]?.node_id || '';
      if (selected) expanded.add(value.map_tree.root_node_id);
    }
    if (value.node && (!selected || value.node.node_id === selected)) { selected = value.node.node_id; detail = value.node; }
    if (value.node && detail?.node_id !== selected) detail = null;
    el.warnings.replaceChildren(...warnings.map(text => make('li', text)));
    el.warnings.hidden = warnings.length === 0;
    render();
  }
  function make(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
  }
  function properties(element, pairs) {
    const entries = pairs.map(([label, value]) => [make('dt', label), make('dd', value === undefined || value === null || value === '' ? '—' : String(value))]);
    element.replaceChildren(...(element === el.overview ? entries.map(pair => { const group = document.createElement('div'); group.append(...pair); return group; }) : entries.flat()));
  }
  function render() {
    if (!inspection) return;
    const model = inspection.model_form;
    el.content.hidden = false;
    el.name.textContent = model.process_name || 'Unnamed model form';
    el.description.textContent = model.process_description || 'Model form configuration';
    properties(el.overview, [
      ['Customer', customerName || customer || 'Current connection'], ['Root dataset', model.root_feature_code],
      ['Template', model.template_name || model.template?.template_name], ['Template type', model.template_type || model.template?.template_type],
      ['Availability', model.active ? 'Active' : 'Inactive'], ['Assignment', model.global_assignment ? 'Global' : 'Assigned users']
    ]);
    el.counts.textContent = `${model.map_node_count ?? nodes.length} nodes · ${model.map_item_count ?? 0} mappings`;
    renderTree(); renderDetail(); controls();
  }
  function renderTree() {
    const focused = el.tree.contains(document.activeElement) ? document.activeElement.dataset.nodeId : null;
    const scrollTop = el.tree.scrollTop;
    if (!nodes.length) { el.tree.replaceChildren(make('p', inspection.model_form.map_id ? 'Map structure has not been loaded.' : 'No map configured.', 'muted empty')); return; }
    const byParent = new Map();
    const ids = new Set(nodes.map(node => node.node_id));
    for (const node of nodes) {
      const key = ids.has(node.parent_node_id) ? node.parent_node_id : '';
      if (!byParent.has(key)) byParent.set(key, []);
      byParent.get(key).push(node);
    }
    const visited = new Set();
    function branch(parent) {
      const list = document.createElement('ul');
      for (const node of byParent.get(parent) || []) {
        if (visited.has(node.node_id)) continue;
        visited.add(node.node_id);
        const row = document.createElement('li');
        const hasChildren = byParent.has(node.node_id);
        const container = hasChildren ? document.createElement('details') : row;
        const control = document.createElement(hasChildren ? 'summary' : 'button');
        if (!hasChildren) { control.type = 'button'; control.className = 'leaf'; }
        control.append(make('span', node.map_name || node.feature_code || 'Map node'), make('small', [node.feature_code, node.sheet && `Sheet: ${node.sheet}`, `${node.map_item_count ?? 0} mappings`].filter(Boolean).join(' · ')));
        control.dataset.nodeId = node.node_id;
        if (node.node_id === selected) control.setAttribute('aria-current', 'true');
        control.addEventListener('click', event => { event.stopPropagation(); if (!busy) selectNode(node.node_id); });
        container.append(control);
        if (hasChildren) {
          container.open = expanded.has(node.node_id);
          container.addEventListener('toggle', () => { if (container.open) expanded.add(node.node_id); else expanded.delete(node.node_id); });

    }

  function renderDetail() {
    const node = detail?.node_id === selected ? detail : nodes.find(item => item.node_id === selected);
    el['node-name'].textContent = node?.map_name || node?.feature_code || 'Select a map node';
    el['node-description'].textContent = node?.map_description || '';
    if (!node) { el['node-meta'].replaceChildren(); el.mappings.replaceChildren(); return; }
    properties(el['node-meta'], [['Dataset', node.feature_code], ['Relationship', node.relationship || 'Root'], ['Worksheet', node.sheet], ['Repeating', detail?.node_id === selected ? detail.multi_entity_direction || 'No' : 'Select to inspect'], ['Filters', node.filter_count ?? 0], ['Sorts', node.sort_count ?? 0]]);

    if (!detail || detail.node_id !== selected) { el.mappings.append(make('p', canCall() ? 'Select this node to load its field mappings.' : 'Ask the agent to read this node to inspect its mappings.', 'muted empty')); return; }

    const items = detail.map_items || [];
    if (!items.length) { el.mappings.append(make('p', 'No mappings on this node.', 'muted empty')); return; }

    wrap.tabIndex = 0; wrap.setAttribute('role', 'region'); wrap.setAttribute('aria-label', 'Field mappings');
    const table = document.createElement('table');
    const head = document.createElement('thead'), row = document.createElement('tr');
    for (const label of ['Field / layout item', 'Type', 'Usage', 'Cell']) { const th = make('th', label); th.scope = 'col'; row.append(th); }
    head.append(row); table.append(head);
    const body = document.createElement('tbody');
    for (const item of [...items].sort((a, b) => a.map_order - b.map_order)) {
      const tr = document.createElement('tr');
      for (const value of [item.schema_code || item.item_type, item.item_type, item.usage, item.cell]) tr.append(make('td', value || '—'));

  function verified() {

    const version = epoch;
    busy = true; controls();
    if (!checkOnly) status('Refreshing model form…');
    try {
      if (checkOnly || inspection?.model_form.unsupported_detail_reason) {
        const overview = await read();
        if (version !== epoch) return;
        if (overview.value.model_form.unsupported_detail_reason) { accept(overview); verified(); status(overview.value.model_form.unsupported_detail_reason); return; }
        if (overview.value.model_form.conflict_token === treeToken) { verified(); return; }

      if (version !== epoch) return;

      if (selected) {
        const result = await read('node', selected);

  }
  async function selectNode(id) {

    if (!canCall()) { renderTree(); return; }
    detail = null;
    const version = epoch;
    busy = true; controls();
    try {
      const result = await read('node', id);

      if (changed) reload = true;
      else verified();

  }
  el.refresh.addEventListener('click', () => refresh());
  el.auto.addEventListener('change', () => { if (el.auto.checked) refresh(true); else verified(); });
  const check = () => { if (visible && document.visibilityState !== 'hidden' && el.auto.checked) refresh(true); };

  window.addEventListener('focus', check);

    } catch (error) { status(error.message); }
  })();
</script>
